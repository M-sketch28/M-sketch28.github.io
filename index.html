

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!--L'importmap est comme un petit dictionnaire qui indique au navigateur où trouver les modules JavaScript lorsqu'on utilise leurs noms dans les instructions import -->
    <script type="importmap"> {
        "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/" : "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
        }
    }
    </script>
    
    <title>Palais mental</title>

</head>

<body>
    <main id="palais">
        <div id="scene"></div> <!-- Récupérer par JavaScript pour y inséerer le canvas THREE.js(bibliothèque javascript externe) -->

        <section id="interface">

            <div id="lieu-actuel">
                <span class="lieu-indicateur"></span>
                <span>LE VESTIBULE</span>
                <span class= "lieu-indications"> Explore ton palais mental</span>
            </div>

            <div id="commandes-directions">

                <span class="touches">DIRECTION</span>

                <div class="grille-fleches">
                    <button class="fleche haut">↑</button>
                    <button class="fleche gauche">←</button>
                    <button class="fleche droite">→</button>
                    <button class="fleche bas">↓</button>
                </div>
            </div>

        </section>
    </main>

    <section id="fiche-organe"> <!-- représente notre fiche -->

    <button id="fermer-fiche">×</button> <!-- Bouton pour fermer la fiche -->

    <h2 id="nom-organe">Le Cœur</h2>

    <div class="contenu-fiche"> <!-- div regroupe organise les éléments-->

        <div id="image-organe">
            <img src="images/coeur.png" alt="Illustration du cœur">
        </div>

        <div class="informations-organe">

            <h3>Fonction</h3>
            <p id="fonction-organe">
                Pompe le sang dans tout l'organisme.
            </p>

            <h3>Description</h3>
            <p id="description-organe">
                Le cœur est un muscle puissant qui bat sans arrêt,
                envoyant le sang vers le cerveau, les poumons
                et le reste du corps.
            </p>

            <h3>À savoir</h3>
            <p id="fait-organe">
                Il bat en moyenne 100 000 fois par jour.
            </p>

        </div>

    </div>

</section>

    <script type="module" src="script.js"></script>

</body>

</html>
